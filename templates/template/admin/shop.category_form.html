<{include file="admin/header.html"}>

<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-header">
            <strong><{if $category}>编辑分类<{else}>添加分类<{/if}></strong>
        </div>
        <div class="layui-card-body">
            <form class="layui-form" action="/acs/?ct=shop_admin&ac=category&action=save" method="post">
                <{if $category}>
                <input type="hidden" name="id" value="<{$category.id}>">
                <{/if}>
                
                <div class="layui-form-item">
                    <label class="layui-form-label">分类名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="name" value="<{$category.name}>" required lay-verify="required" placeholder="请输入分类名称" class="layui-input">
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <label class="layui-form-label">父分类</label>
                    <div class="layui-input-block">
                        <select name="pid">
                            <option value="0">顶级分类</option>
                            <{if $category_list}>
                            <{foreach from=$category_list item=item}>
                            <{if $item.pid == 0 && $item.id != $category.id}>
                            <option value="<{$item.id}>" <{if $category.pid == $item.id}>selected<{/if}>><{$item.name}></option>
                            <{/if}>
                            <{/foreach}>
                            <{/if}>
                        </select>
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <label class="layui-form-label">排序</label>
                    <div class="layui-input-block">
                        <input type="number" name="sort" value="<{$category.sort|default:0}>" class="layui-input">
                        <div class="layui-form-mid layui-word-aux">数字越小越靠前</div>
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="status" value="1" title="启用" <{if !$category || $category.status == 1}>checked<{/if}>>
                        <input type="radio" name="status" value="0" title="禁用" <{if $category.status == 0}>checked<{/if}>>
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button class="layui-btn" lay-submit lay-filter="formSubmit">保存</button>
                        <button type="button" class="layui-btn layui-btn-primary" onclick="history.back()">返回</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="/ffsm/statics/ffsm/kmmb/layui/layui.js"></script>
<script>
layui.use(['form'], function(){
    var form = layui.form;
});
</script>

<{include file="admin/footer_layui.html"}>
