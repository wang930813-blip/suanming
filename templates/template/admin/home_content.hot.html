<{include file="admin/header.html"}>

<div class="layui-fluid" style="padding: 20px;">
    <div class="layui-card">
        <div class="layui-card-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0;">本周热门管理</h3>
                <button type="button" class="layui-btn layui-btn-normal" onclick="addItem()">
                    <i class="layui-icon layui-icon-add-1"></i> 添加热门
                </button>
            </div>
        </div>
        <div class="layui-card-body">
            <table class="layui-table" lay-skin="line">
                <thead>
                    <tr>
                        <th width="80">ID</th>
                        <th width="150">图片</th>
                        <th>标题</th>
                        <th>链接</th>
                        <th width="80">排序</th>
                        <th width="80">状态</th>
                        <th width="200">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <{if isset($list) && is_array($list)}>
                    <{foreach from=$list item=v}>
                    <tr>
                        <td><{$v.id}></td>
                        <td>
                            <img src="/ffsm/<{$v.image}>" style="max-width: 120px; max-height: 60px;">
                        </td>
                        <td><{$v.title}></td>
                        <td><{$v.link}></td>
                        <td><{$v.sort}></td>
                        <td>
                            <{if $v.status == 1}>
                            <span class="layui-badge layui-bg-green">启用</span>
                            <{else}>
                            <span class="layui-badge layui-bg-gray">禁用</span>
                            <{/if}>
                        </td>
                        <td>
                            <button class="layui-btn layui-btn-xs" onclick="editItem(<{$v.id}>)">
                                <i class="layui-icon layui-icon-edit"></i> 编辑
                            </button>
                            <button class="layui-btn layui-btn-xs layui-btn-danger" onclick="deleteItem(<{$v.id}>)">
                                <i class="layui-icon layui-icon-delete"></i> 删除
                            </button>
                        </td>
                    </tr>
                    <{/foreach}>
                    <{else}>
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 50px;">暂无数据</td>
                    </tr>
                    <{/if}>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
function addItem() {
    layui.use('layer', function(){
        var layer = layui.layer;
        layer.open({
            type: 2,
            title: '添加本周热门',
            shade: 0.3,
            area: ['600px', '500px'],
            content: '?ct=home_content&ac=hot_form'
        });
    });
}

function editItem(id) {
    layui.use('layer', function(){
        var layer = layui.layer;
        layer.open({
            type: 2,
            title: '编辑本周热门',
            shade: 0.3,
            area: ['600px', '500px'],
            content: '?ct=home_content&ac=hot_form&id=' + id
        });
    });
}

function deleteItem(id) {
    layui.use('layer', function(){
        var layer = layui.layer;
        layer.confirm('确定要删除这个热门项目吗？', {
            icon: 3,
            title: '删除确认',
            btn: ['确定删除', '取消']
        }, function(index){
            window.location.href = '?ct=home_content&ac=hot&action=delete&id=' + id;
        });
    });
}
</script>

<{include file='admin/footer.html'}>
