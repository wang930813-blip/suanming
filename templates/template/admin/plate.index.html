<{include file="admin/header.html"}>
<div class="app-content flex-column-fluid py-3 py-lg-6">
	<div class="layui-container">
		<div class="layui-card">
			<div class="layui-card-header align-items-center py-5 gap-2 gap-md-5">
				<div class="layui-card-title">
                    <h2><{$web_title}> </h2>
                </div>
			</div>
			<div class="layui-card-body pt-0" style="padding: 2rem 2.25rem 0rem 2.25rem;">
				<table class="layui-table" lay-skin="line fs-6 gy-5">
					<thead>
						<tr class="text-start text-gray-500 fw-bold fs-7 text-uppercase gs-0">
            				<th>
								<div class="form-check form-check-sm form-check-custom form-check-solid me-3">
									<input class="" type="checkbox" name="checkbox" value="" rel="parent"/>
								</div>
							</th>
            				<th>name  (链接参数) </th>
            				<th> title </th>
            				<th> SEO标题 </th>
            				<th> Keywords （关键词）</th>
            				<th> description（描述） </th>
            				<th> 操作 </th>
						</tr>
					</thead>
					<tbody class="fw-semibold text-gray-600">
            			<{lurd_list item='v'}>
            			<tr>
            				<td> 
								<div class="form-check form-check-sm form-check-custom form-check-solid me-3">
									<input class="" type="checkbox" name="uid[]" value="<{$v.uid}>" rel="child" />
								</div>
            				</td>
            				<td> <a href="//<{$web_url}>/?ac=<{$v.name}>" target="_blank"><{$v.name}></a> </td>
            				<td> <{$v.title}> </td>
            				<td style="max-width: 200px;"> <{$v.seotitle}> </td>
            				<td style="max-width: 200px;"> <{$v.keywords}>  </td>
            			    <td style="max-width: 200px;"> <{$v.description}> </td>
            				<td>
								<a href="#" class="btn btn-sm btn-light btn-flex btn-center btn-active-light-primary" data-kt-menu-trigger="click" data-kt-menu-placement="bottom-end">更多操作 
								<i class="ki-duotone ki-down fs-5 ms-1"></i></a>
								<div class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-semibold fs-7 w-125px py-4" data-kt-menu="true">
									<div class="menu-item px-3">
										<a href="javascript:edit_plate_modal('<{$v.name}>');" class="menu-link px-3">修改</a>
									</div>
									<div class="menu-item px-3">
										<a onclick="do_addrecommend_one('<{$v.name}>')" class="menu-link px-3" data-kt-ecommerce-product-filter="delete_row">推荐板块</a>
									</div>
								</div>
            				</td>
            			</tr>
            			<{/lurd_list}>
					</tbody>
				</table>
				<{$lurd_pagination}>
			</div>
		</div>
	</div>
</div>

<script>
layui.use(['layer'], function(){
    var layer = layui.layer;
    
    // 编辑弹窗
    window.edit_plate_modal = function(name) {
        openLayerIframe('修改功能板块', '?ct=plate&ac=index&even=edit&tb=plate&name=' + name + '&TB_iframe=true', '650px', '550px');
    };
    
    // 添加到推荐
    window.do_addrecommend_one = function(name) {
        layer.confirm('确定要添加到推荐板块吗？', {
            icon: 3,
            title: '添加确认',
            btn: ['确定', '取消']
        }, function(index){
            layer.msg('正在添加...', {icon: 16, shade: 0.3});
            window.location.href = "?ct=plate&ac=index&even=recommend&tb=plate&name=" + name;
        });
    };
});
</script>

<{include file='admin/footer.html'}>
