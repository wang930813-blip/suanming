<{include file="admin/header.html"}>


<div class="app-content flex-column-fluid py-3 py-lg-6">
	<div class="layui-container">
		<div class="layui-card">
			<div class="layui-card-header align-items-center py-5 gap-2 gap-md-5">
				<div class="layui-card-title">
                    <h2><{$web_title}> </h2>
                </div>
				<div class="card-toolbar flex-row-fluid justify-content-end gap-5">
                    <form name="form1" action="?ct=search" method="POST">
                        <div class="fl">
                            <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" onclick="add_search_modal()">增加</button>
                        </div>
                    </form>
                </div>
			</div>
			<div class="layui-card-body pt-0" style="padding: 2rem 2.25rem 0rem 2.25rem;">
				<table class="layui-table" lay-skin="line fs-6 gy-5">
					<thead>
						<tr class="text-start text-gray-500 fw-bold fs-7 text-uppercase gs-0">
            				<th>
								<div class="form-check form-check-sm form-check-custom form-check-solid me-3">
									<input class="" type="checkbox" name="checkbox" value="" rel="parent"/>
								</div>
							</th>
            				<th> 搜索关键词 </th>
                            <th> 匹配板块</th>
                            <th> 跳转链接</th>
            				<th> 添加时间</th>
            				<th> 操作 </th>
						</tr>
					</thead>
					<tbody class="fw-semibold text-gray-600">
            			<{lurd_list item='v'}>
            			<tr>
            				<td> 
								<div class="form-check form-check-sm form-check-custom form-check-solid me-3">
									<input class="" type="checkbox" name="id[]" value="<{$v.id}>" rel="child" />
								</div>
            				</td>
            				<td> <{$v.title}> </td>
                            <td style="max-width: 200px;"> <{$v.system_name}> </td>
                            <td style="max-width: 200px;"> <{$v.url}>  </td>
            				<td style="max-width: 200px;"> <{$v.createtime|date_format:'%Y-%m-%d %H:%M:%S'}> </td>
            				<td>
								<a href="#" class="btn btn-sm btn-light btn-flex btn-center btn-active-light-primary" data-kt-menu-trigger="click" data-kt-menu-placement="bottom-end">更多操作 
								<i class="ki-duotone ki-down fs-5 ms-1"></i></a>
								<div class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-semibold fs-7 w-125px py-4" data-kt-menu="true">
									<div class="menu-item px-3">
										<a href="javascript:edit_search_modal('<{$v.id}>');" class="menu-link px-3">修改</a>
									</div>
                                    <div class="menu-item px-3">
										<a onclick="do_delete_one('<{$v.id}>')" class="menu-link px-3" data-kt-ecommerce-product-filter="delete_row">删除</a>
									</div>
								</div>
            				</td>
            			</tr>
            			<{/lurd_list}>
					</tbody>
				</table>
				<{$lurd_pagination}>
			</div>
		</div>
	</div>
</div>

<{include file='admin/footer.html'}>
<script>
layui.use(['layer'], function(){
    var layer = layui.layer;
    
    // 添加弹窗
    window.add_search_modal = function() {
        openLayerIframe('添加搜索关键词', '?ct=search&ac=index&even=add&tb=search&TB_iframe=true', '650px', '400px');
    };
    
    // 编辑弹窗
    window.edit_search_modal = function(id) {
        openLayerIframe('修改搜索关键词', '?ct=search&ac=index&even=edit&tb=search&id=' + id + '&TB_iframe=true', '650px', '400px');
    };
    
    // 删除确认
    window.do_delete_one = function(id) {
        layer.confirm('确定要删除这个搜索关键词吗？', {
            icon: 3,
            title: '删除确认',
            btn: ['确定删除', '取消']
        }, function(index){
            layer.msg('正在删除...', {icon: 16, shade: 0.3});
            window.location.href = "?ct=search&ac=index&even=delete&tb=search&id[]=" + id;
        });
    };
});
</script>
