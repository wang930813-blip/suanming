<script>
$(function(){
    var curid = $(":input:checked").val();
    curid = curid+'id';
    alterUC(curid);
});

function alterUC(id) {
    var curid = id;
    var obj = $("table[id='table']>tbody");
    $("table[id='table']>tbody").each(function(){
        if(this.id==curid) {
            $(this).css('display','');
        } else {
            $(this).css('display','none');
        }
    });
}
</script>
